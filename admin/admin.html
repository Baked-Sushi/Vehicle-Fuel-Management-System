<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pump Station Admin Panel</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header>
      <!-- Top header showing admin panel title and logged-in admin's name -->
      <h1>Pump Station Admin Panel</h1>
      <div class="user-actions">
        <span id="currentUsername"></span>
      </div>
    </header>

    <div class="sidebar">
      <!-- Left sidebar containing navigation menu and logout button -->
      <div class="navigation">
        <button class="nav-link active" data-page="dashboard">Dashboard</button>
        <button class="nav-link" data-page="user-accounts">User Accounts</button>
        <button class="nav-link" data-page="transactions">Transactions</button>
      </div>

      <button id="logoutBtn" class="logout">Logout</button>
    </div>

    <div class="main-content">
      <!-- Right-side main content where admin pages are displayed -->

      <!-- Dashboard Page - Shows admin overview statistics -->
      <section id="dashboard" class="page active-page">
        <h2>Dashboard</h2>

        <div class="ticket-counter">
          <h3>Total Users</h3>

          <h1 id="totalUsers">0</h1>
        </div>

        <div class="ticket-counter">
          <h3>Total Transactions</h3>

          <h1 id="totalTransactions">0</h1>
        </div>
      </section>

      <!-- User Accounts Page - Manage and view registered users -->
      <section id="user-accounts" class="page">
        <h2>Manage User Accounts</h2>

        <h3>Search Users</h3>

        <form id="searchForm">
          <label for="searchRole">Filter by Role</label>
          <select id="searchRole">
            <option value="">All Roles</option>
            <option>Customer</option>
            <option>Staff / Cashier</option>
            <option>Station Manager</option>
            <option>Admin</option>
          </select>

          <label for="searchUsername">Username</label>
          <input type="text" id="searchUsername" placeholder="Enter username" />

          <button type="submit">Search</button>
        </form>

        <div class="add-user-section">
          <h3>Add New User</h3>

          <form id="addUserForm">
            <label for="addUsername">Username</label>
            <input
              type="text"
              id="addUsername"
              placeholder="Enter username"
              required
            />

            <label for="addPassword">Password</label>
            <input
              type="password"
              id="addPassword"
              placeholder="Enter password"
              required
            />

            <label for="addRole">Role</label>
            <select id="addRole" required>
              <option value="">Select Role</option>
              <option>Customer</option>
              <option>Staff / Cashier</option>
              <option>Station Manager</option>
              <option>Admin</option>
            </select>

            <button type="submit">Add User</button>

            <p id="addUserMessage"></p>
          </form>
        </div>

        <h3>Registered Users</h3>

        <div id="userList">
          <p>Use the search above to find users.</p>
        </div>
      </section>

      <!-- Transactions Page - Monitor all staff fuel sale transactions -->
      <section id="transactions" class="page">
        <h2>Monitor Transactions</h2>

        <div class="ticket-counter">
          <h3>Total Transactions</h3>

          <h1 id="transactionCount">0</h1>
        </div>

        <div class="ticket-counter">
          <h3>Total Revenue</h3>

          <h1 id="transactionRevenue">0.00</h1>
        </div>

        <h3>Transaction Log</h3>

        <div id="transactionList">
          <p>No transactions found.</p>
        </div>
      </section>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
